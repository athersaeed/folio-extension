<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic Engineer @ Synthetic Co</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
      .ashby-application-form-field-entry, fieldset { margin: 14px 0; }
      .ashby-application-form-question-title { display: block; font-weight: 600; }
      input[type="text"], input[type="email"], input[type="tel"], input[role="combobox"], select { width: 100%; padding: 6px; }
      button[aria-pressed="true"] { background: #222; color: #fff; }
      [role="listbox"] { border: 1px solid #999; max-width: 640px; margin: 0 auto; }
      [role="option"] { padding: 4px 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="dist/ashby.js"></script>
    <script src="dist/content.js"></script>
  </body>
</html>
